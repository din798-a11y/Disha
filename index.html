<!doctype html>
<html lang="gu" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ઉદ્યોગસાહસિક મૂલ્યાંકન — સ્વ-આકારણી અને વિશ્લેષણ</title>
<meta name="description" content="ગુજરાતી ભાષામાં ઉદ્યોગસાહસિક તૈયારીનું નિ:શુલ્ક સ્વ-મૂલ્યાંકન. તરત વિગતવાર પરિણામ અને ક્ષેત્રવાર વિશ્લેષણ મેળવો.">
<meta property="og:title" content="ઉદ્યોગસાહસિક મૂલ્યાંકન">
<meta property="og:description" content="ગુજરાતી ભાષામાં ઉદ્યોગસાહસિક તૈયારીનું સ્વ-મૂલ્યાંકન અને એનાલિટિક્સ ડેશબોર્ડ.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#12312B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312312B'/%3E%3Crect x='7' y='6' width='6' height='20' fill='%23C8871A'/%3E%3Crect x='16' y='6' width='3' height='20' fill='%23F2F4F0'/%3E%3C/svg%3E">
<style>
/* =============================================================
   ઉદ્યોગસાહસિક મૂલ્યાંકન — design system
   Direction: the Gujarati trader's ledger (ચોપડો). Structure comes from
   ruled hairlines, dotted leaders and tabular figures rather than cards
   and gradients. Marigold is the single accent.
   ============================================================= */
:root{
  --ink:#12312B; --ink-soft:#4A625B; --ink-faint:#7C918B;
  --paper:#F2F4F0; --surface:#FFFFFF; --surface-2:#E9EDE8;
  --rule:#D5DDD7; --rule-strong:#B3C0B8;
  --haldi:#C8871A; --haldi-soft:#F6EBD4; --kumkum:#A8382C; --kumkum-soft:#F7E3E0;
  --indigo:#40618F; --plum:#7A4E8C; --moss:#2E7D6B; --focus:#12312B;
  --font-display:'Hind Vadodara','Shruti','Nirmala UI','Noto Sans Gujarati',sans-serif;
  --font-body:'Noto Sans Gujarati','Shruti','Nirmala UI','Hind Vadodara',sans-serif;
  --font-mono:'IBM Plex Mono','Consolas',ui-monospace,monospace;
  --step--1:clamp(.78rem,.76rem + .1vw,.84rem);
  --step-0:clamp(.95rem,.92rem + .15vw,1.02rem);
  --step-1:clamp(1.12rem,1.05rem + .35vw,1.3rem);
  --step-2:clamp(1.35rem,1.2rem + .7vw,1.72rem);
  --step-3:clamp(1.7rem,1.4rem + 1.4vw,2.5rem);
  --step-4:clamp(2.3rem,1.7rem + 2.8vw,3.8rem);
  --sp-1:.25rem;--sp-2:.5rem;--sp-3:.75rem;--sp-4:1rem;--sp-5:1.5rem;--sp-6:2rem;--sp-7:3rem;--sp-8:4rem;
  --radius:3px;
  --shadow:0 1px 2px rgba(18,49,43,.05),0 4px 14px rgba(18,49,43,.05);
  --maxw:62rem;
}
[data-theme="dark"]{
  --ink:#E3EDE8; --ink-soft:#A6BAB3; --ink-faint:#7B928B;
  --paper:#0C1614; --surface:#132320; --surface-2:#1B302B;
  --rule:#26403A; --rule-strong:#38564E;
  --haldi:#E0A33A; --haldi-soft:#2E2716; --kumkum:#D9705F; --kumkum-soft:#331F1C;
  --indigo:#7E9CC9; --plum:#B189C4; --moss:#5FB39D; --focus:#E0A33A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
  font-size:var(--step-0);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.22;margin:0;letter-spacing:-.005em}
p{margin:0 0 var(--sp-4)}
a{color:var(--ink);text-decoration-color:var(--rule-strong);text-underline-offset:3px}
a:hover{text-decoration-color:var(--haldi)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.eyebrow{font-family:var(--font-mono);font-size:var(--step--1);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 var(--sp-2);display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- signature device: the ledger rule ---- */
.rule{border:0;border-top:1px solid var(--rule);margin:var(--sp-5) 0}
.rule-double{border:0;height:4px;margin:var(--sp-5) 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.ledger{list-style:none;margin:0;padding:0}
.ledger-row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:var(--sp-3);
  padding:var(--sp-3) 0 var(--sp-2);border-bottom:1px solid var(--rule);position:relative}
.ledger-label{display:flex;align-items:baseline;gap:var(--sp-2);min-width:0}
.ledger-leader{flex:1 1 auto;border-bottom:1px dotted var(--rule-strong);transform:translateY(-.25em);min-width:1rem}
.ledger-figure{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.ledger-bar{grid-column:1/-1;height:3px;background:var(--surface-2);margin-top:var(--sp-1);overflow:hidden}
.ledger-bar>i{display:block;height:100%;background:var(--ink);transition:width .5s cubic-bezier(.2,.7,.3,1)}

/* ---- shell ---- */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp-5)}
.masthead{border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:30}
.masthead-in{max-width:var(--maxw);margin:0 auto;padding:var(--sp-3) var(--sp-5);
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:var(--step-1);letter-spacing:-.01em;
  text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:var(--sp-2);cursor:pointer}
.wordmark::before{content:"";width:10px;height:22px;flex:none;background:var(--haldi);box-shadow:3px 0 0 var(--ink)}
.masthead-tools{display:flex;align-items:center;gap:var(--sp-2)}
footer.site-foot{border-top:1px solid var(--rule);margin-top:var(--sp-8);padding:var(--sp-5) 0 var(--sp-7);
  color:var(--ink-faint);font-size:var(--step--1)}

/* ---- controls ---- */
.btn{font-family:var(--font-body);font-size:var(--step-0);font-weight:500;line-height:1.2;
  padding:.7em 1.15em;border:1px solid var(--ink);border-radius:var(--radius);background:var(--surface);
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  transition:background .15s ease,color .15s ease,border-color .15s ease;text-decoration:none}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-primary:hover:not(:disabled){background:#1c4a41}
[data-theme="dark"] .btn-primary{color:#0C1614}
.btn-accent{background:var(--haldi);border-color:var(--haldi);color:#1B1403}
.btn-accent:hover:not(:disabled){filter:brightness(1.06)}
.btn-quiet{border-color:var(--rule);color:var(--ink-soft)}
.btn-quiet:hover:not(:disabled){border-color:var(--rule-strong);color:var(--ink)}
.btn-danger{border-color:var(--kumkum);color:var(--kumkum)}
.btn-danger:hover:not(:disabled){background:var(--kumkum-soft)}
.btn-sm{font-size:var(--step--1);padding:.45em .8em}
.field{margin-bottom:var(--sp-4)}
.field>label,.label{display:block;font-size:var(--step--1);font-weight:500;color:var(--ink-soft);margin-bottom:var(--sp-2)}
.req{color:var(--kumkum)}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=password],
input[type=date],input[type=search],select,textarea{width:100%;font-family:var(--font-body);
  font-size:var(--step-0);color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);
  border-radius:var(--radius);padding:.62em .75em}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--ink)}
textarea{min-height:6rem;resize:vertical;line-height:1.6}
.hint{font-size:var(--step--1);color:var(--ink-faint);margin-top:var(--sp-1)}
.err-text{font-size:var(--step--1);color:var(--kumkum);margin-top:var(--sp-1)}
.checkline{display:flex;gap:var(--sp-3);align-items:flex-start;font-size:var(--step-0);cursor:pointer}
.checkline input{margin-top:.35em;width:1.05em;height:1.05em;flex:none;accent-color:var(--ink)}

/* ---- notices & toasts ---- */
.notice{border:1px solid var(--rule);border-inline-start:3px solid var(--ink-faint);background:var(--surface);
  padding:var(--sp-3) var(--sp-4);border-radius:var(--radius);font-size:var(--step--1);margin-bottom:var(--sp-4)}
.notice-warn{border-inline-start-color:var(--haldi);background:var(--haldi-soft)}
.notice-error{border-inline-start-color:var(--kumkum);background:var(--kumkum-soft);color:var(--kumkum)}
.notice-demo{border-inline-start-color:var(--haldi);background:var(--haldi-soft)}
.toast-stack{position:fixed;inset-block-end:var(--sp-5);inset-inline-start:50%;transform:translateX(-50%);
  z-index:100;display:flex;flex-direction:column;gap:var(--sp-2);width:min(30rem,calc(100vw - 2rem))}
.toast{background:var(--ink);color:var(--paper);padding:var(--sp-3) var(--sp-4);border-radius:var(--radius);
  font-size:var(--step--1);box-shadow:var(--shadow);animation:toast-in .2s ease-out}
.toast-error{background:var(--kumkum)}
[data-theme="dark"] .toast{color:#0C1614}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- landing ---- */
.hero{padding:var(--sp-7) 0 var(--sp-5)}
.hero h1{font-size:var(--step-3);max-width:22ch}
.hero .lede{font-size:var(--step-1);color:var(--ink-soft);max-width:56ch;margin-top:var(--sp-4)}
.assess-list{list-style:none;margin:0;padding:0}
.assess-item{border-bottom:1px solid var(--rule);padding:var(--sp-5) 0;display:grid;
  grid-template-columns:1fr auto;gap:var(--sp-4) var(--sp-5);align-items:center}
.assess-item:first-child{border-top:1px solid var(--rule)}
.assess-item h2{font-size:var(--step-2)}
.assess-item p{color:var(--ink-soft);margin:var(--sp-2) 0 var(--sp-3);max-width:60ch}
.assess-meta{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);font-family:var(--font-mono);
  font-size:var(--step--1);color:var(--ink-faint)}
@media (max-width:42rem){.assess-item{grid-template-columns:1fr}.assess-item .btn{width:100%}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);
  padding:var(--sp-5);box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 var(--sp-4)}

/* ---- questionnaire ---- */
.q-bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--rule)}
.q-bar-in{max-width:48rem;margin:0 auto;padding:var(--sp-3) var(--sp-5);display:flex;align-items:center;gap:var(--sp-4)}
.q-count{font-family:var(--font-mono);font-size:var(--step--1);white-space:nowrap}
.q-count b{font-size:var(--step-0);font-weight:600}
.q-ticks{display:flex;gap:2px;flex:1 1 auto;min-width:0}
.q-ticks i{flex:1 1 0;height:12px;background:var(--surface-2);border-radius:1px;transition:background .2s ease;min-width:2px}
.q-ticks i[data-state=done]{background:var(--moss)}
.q-ticks i[data-state=current]{background:var(--haldi)}
.q-ticks i[data-state=missing]{background:var(--kumkum)}
.q-stage{max-width:48rem;margin:0 auto;padding:var(--sp-6) var(--sp-5) var(--sp-8)}
.q-card{animation:q-in .22s ease-out}
@keyframes q-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q-scenario{border-inline-start:3px solid var(--haldi);background:var(--haldi-soft);padding:var(--sp-4);
  border-radius:var(--radius);margin-bottom:var(--sp-4);font-size:var(--step-0)}
.q-text{font-family:var(--font-display);font-size:var(--step-2);font-weight:600;margin-bottom:var(--sp-2)}
.q-help{color:var(--ink-faint);font-size:var(--step--1);margin-bottom:var(--sp-4)}
.opts{display:flex;flex-direction:column;gap:var(--sp-2);margin:var(--sp-5) 0}
.opt{display:flex;align-items:center;gap:var(--sp-3);border:1px solid var(--rule-strong);
  border-radius:var(--radius);background:var(--surface);padding:var(--sp-4);cursor:pointer;
  transition:border-color .15s ease,background .15s ease;font-size:var(--step-0);min-height:3.25rem}
.opt:hover{border-color:var(--ink-faint)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{width:1.3rem;height:1.3rem;flex:none;border:1px solid var(--rule-strong);
  background:var(--surface);display:grid;place-items:center}
.opt[data-shape=radio] .mark{border-radius:50%}
.opt .mark::after{content:"";width:.65rem;height:.65rem;transform:scale(0);transition:transform .12s ease;background:var(--paper)}
.opt[data-shape=radio] .mark::after{border-radius:50%}
.opt input:checked~.mark{background:var(--ink);border-color:var(--ink)}
.opt input:checked~.mark::after{transform:scale(1)}
.opt:has(input:checked){border-color:var(--ink);background:var(--surface-2)}
.opt input:focus-visible~.mark{outline:2px solid var(--focus);outline-offset:2px}
.rating{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-5) 0}
.rating label{flex:1 1 3rem;min-width:3rem;border:1px solid var(--rule-strong);border-radius:var(--radius);
  padding:var(--sp-3) 0;text-align:center;cursor:pointer;font-family:var(--font-mono);
  font-size:var(--step-1);background:var(--surface);transition:all .12s ease}
.rating input{position:absolute;opacity:0;pointer-events:none}
.rating label:hover{border-color:var(--ink-faint)}
.rating label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rating-ends{display:flex;justify-content:space-between;font-size:var(--step--1);color:var(--ink-faint)}
.q-nav{display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;
  border-top:1px solid var(--rule);padding-top:var(--sp-4);margin-top:var(--sp-5)}
.q-nav .spacer{flex:1}
.q-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:var(--sp-2)}
.q-map button{aspect-ratio:1;border:1px solid var(--rule-strong);background:var(--surface);
  font-family:var(--font-mono);font-size:var(--step--1);cursor:pointer;border-radius:var(--radius);color:var(--ink)}
.q-map button[data-state=done]{background:var(--moss);border-color:var(--moss);color:#fff}
.q-map button[data-state=current]{outline:2px solid var(--haldi);outline-offset:1px}
.q-map button[data-state=missing]{border-color:var(--kumkum);color:var(--kumkum)}
.save-state{font-size:var(--step--1);color:var(--ink-faint);font-family:var(--font-mono)}

/* ---- dialogs ---- */
dialog{border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface);
  color:var(--ink);padding:var(--sp-5);max-width:min(34rem,calc(100vw - 2rem));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(18,49,43,.45)}
dialog h2{font-size:var(--step-2);margin-bottom:var(--sp-3)}
.dialog-actions{display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-5);flex-wrap:wrap}

/* ---- result ---- */
.result-total{text-align:center;padding:var(--sp-6) 0 var(--sp-4)}
.result-total .figure{font-family:var(--font-mono);font-weight:600;font-size:var(--step-4);
  line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.result-total .fraction{font-family:var(--font-mono);color:var(--ink-faint);font-size:var(--step-0)}
.band{display:inline-block;font-family:var(--font-display);font-weight:600;font-size:var(--step-2);
  padding:var(--sp-2) var(--sp-5);border:1px solid currentColor;border-radius:100px;margin-top:var(--sp-4)}
.chart-frame{position:relative;height:300px}
.chart-frame.short{height:240px}
.cards-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:var(--sp-5)}
.fb-card{border:1px solid var(--rule);border-radius:var(--radius);padding:var(--sp-5);background:var(--surface)}
.fb-card h3{font-size:var(--step-1);margin-bottom:var(--sp-3)}
.fb-card ul{margin:0;padding:0;list-style:none}
.fb-card li{padding:var(--sp-3) 0;border-bottom:1px dotted var(--rule)}
.fb-card li:last-child{border-bottom:0;padding-bottom:0}
.fb-card .cat-tag{font-family:var(--font-mono);font-size:var(--step--1);color:var(--ink-faint);display:block;margin-bottom:2px}
.fb-strength{border-top:3px solid var(--moss)}
.fb-improve{border-top:3px solid var(--haldi)}
.fb-recommend{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--ink);
  padding:var(--sp-5);border-radius:var(--radius)}

/* ---- tables ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
table.data{width:100%;border-collapse:collapse;font-size:var(--step--1)}
table.data th,table.data td{padding:var(--sp-3) var(--sp-4);text-align:start;border-bottom:1px solid var(--rule);white-space:nowrap}
table.data th{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:500;background:var(--surface-2);position:sticky;top:0}
table.data tbody tr:hover{background:var(--surface-2)}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.num,table.data th.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:end}
.pill{display:inline-block;padding:2px 10px;border-radius:100px;font-size:.72rem;border:1px solid currentColor;white-space:nowrap}
.tag{display:inline-block;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.05em;
  text-transform:uppercase;padding:1px 7px;border-radius:2px;border:1px solid var(--rule-strong);color:var(--ink-faint)}
.empty{text-align:center;padding:var(--sp-7) var(--sp-5);color:var(--ink-faint);
  border:1px dashed var(--rule-strong);border-radius:var(--radius)}
.empty strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:var(--step-1);margin-bottom:var(--sp-2)}

/* ---- admin ---- */
.admin-shell{display:grid;grid-template-columns:15rem 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--rule);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.side-head{padding:var(--sp-5) var(--sp-5) var(--sp-4);border-bottom:1px solid var(--rule)}
.side-nav{padding:var(--sp-4) var(--sp-3);flex:1}
.side-nav button{display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:start;
  padding:.6rem var(--sp-3);background:none;border:0;border-radius:var(--radius);font:inherit;
  font-size:var(--step-0);color:var(--ink-soft);cursor:pointer;margin-bottom:2px}
.side-nav button:hover{background:var(--surface-2);color:var(--ink)}
.side-nav button[aria-current=page]{background:var(--surface-2);color:var(--ink);font-weight:600;
  box-shadow:inset 3px 0 0 var(--haldi)}
.side-nav .nav-mark{width:1.1rem;text-align:center;font-family:var(--font-mono);font-size:.8rem;color:var(--ink-faint)}
.side-foot{padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--rule);font-size:var(--step--1)}
.admin-main{min-width:0;padding:var(--sp-5) var(--sp-6) var(--sp-8)}
.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);
  flex-wrap:wrap;margin-bottom:var(--sp-5)}
.admin-head h1{font-size:var(--step-2)}
.admin-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.section-block{margin-top:var(--sp-6)}
.section-block>h2{font-size:var(--step-1);margin-bottom:var(--sp-4);padding-bottom:var(--sp-2);border-bottom:1px solid var(--rule)}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:0;
  border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.kpi{padding:var(--sp-4) var(--sp-4) var(--sp-3);border-inline-end:1px solid var(--rule);border-top:3px solid transparent}
.kpi:last-child{border-inline-end:0}
.kpi-label{font-size:var(--step--1);color:var(--ink-faint);display:block;margin-bottom:var(--sp-2);line-height:1.35}
.kpi-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:var(--step-2);
  font-weight:600;line-height:1.1;display:block}
.kpi-sub{font-size:.72rem;color:var(--ink-faint);font-family:var(--font-mono)}
@media (max-width:60rem){.kpi{border-bottom:1px solid var(--rule)}}
.chart-grid{display:grid;gap:var(--sp-5)}
.chart-grid.two{grid-template-columns:repeat(auto-fit,minmax(22rem,1fr))}
.chart-panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:var(--sp-5)}
.chart-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
  margin-bottom:var(--sp-4);flex-wrap:wrap}
.chart-panel-head h3{font-size:var(--step-0);font-weight:600}
.chart-panel-head .tools{display:flex;gap:var(--sp-2);align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink-soft);font:inherit;font-size:var(--step--1);
  padding:.3em .7em;cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--rule-strong)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
[data-theme="dark"] .seg button[aria-pressed=true]{color:#0C1614}
.filter-bar{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:var(--sp-4)}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:var(--sp-3);align-items:end}
.filter-grid .field{margin-bottom:0}
.filter-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;margin-top:var(--sp-4);
  padding-top:var(--sp-4);border-top:1px solid var(--rule)}
.filter-count{font-family:var(--font-mono);font-size:var(--step--1);color:var(--ink-faint);margin-inline-start:auto}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:var(--sp-3)}
.sw-card{border:1px solid var(--rule);border-radius:var(--radius);padding:var(--sp-4);
  background:var(--surface);border-top:3px solid var(--moss)}
.sw-card.weak{border-top-color:var(--kumkum)}
.sw-card .name{font-weight:600;display:block;margin-bottom:var(--sp-2)}
.sw-card .figure{font-family:var(--font-mono);font-size:var(--step-1);font-weight:600}
.sw-card .meta{font-size:var(--step--1);color:var(--ink-faint);display:block}
.q-row{display:grid;grid-template-columns:2.5rem 1fr auto;gap:var(--sp-3);align-items:start;
  padding:var(--sp-3) 0;border-bottom:1px solid var(--rule)}
.q-row:last-child{border-bottom:0}
.q-row .idx{font-family:var(--font-mono);color:var(--ink-faint);font-size:var(--step--1);padding-top:.2em}
.q-row .body{min-width:0}
.q-row .qtext{display:block}
.q-row .qmeta{font-size:var(--step--1);color:var(--ink-faint);font-family:var(--font-mono)}
.q-row .acts{display:flex;gap:var(--sp-1)}
.opt-edit-row{display:grid;grid-template-columns:1fr 5.5rem 2.5rem;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2)}
.pager{display:flex;gap:var(--sp-2);align-items:center;justify-content:center;margin-top:var(--sp-4);flex-wrap:wrap}
.pager .page-info{font-family:var(--font-mono);font-size:var(--step--1);color:var(--ink-faint)}
.side-toggle{display:none}
@media (max-width:62rem){
  .admin-shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:16rem;z-index:60;
    transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side[data-open=true]{transform:none}
  .side-toggle{display:inline-flex}
  .admin-main{padding:var(--sp-4) var(--sp-4) var(--sp-8)}
  .scrim{position:fixed;inset:0;background:rgba(18,49,43,.45);z-index:55}
}
/* ---- print ---- */
@media print{
  @page{margin:14mm}
  :root{--paper:#fff;--surface:#fff;--shadow:none}
  body{background:#fff;font-size:10.5pt}
  .masthead,.site-foot,.no-print,.btn,dialog,.toast-stack,.side,.admin-actions,.filter-bar,.q-bar{display:none!important}
  .admin-shell{grid-template-columns:1fr}
  .panel,.fb-card,.table-wrap,.chart-panel,.kpi-strip{border:1px solid #999;box-shadow:none;break-inside:avoid}
  .chart-frame{height:250px;break-inside:avoid}
  .cards-2{display:block}.fb-card{margin-bottom:8mm}
  a{text-decoration:none}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>
<div id="root"></div>
<noscript>
  <div style="max-width:34rem;margin:4rem auto;padding:0 1.5rem">
    <h1>JavaScript જરૂરી છે</h1>
    <p>આ મૂલ્યાંકન ચલાવવા માટે તમારા બ્રાઉઝરમાં JavaScript ચાલુ કરો.</p>
  </div>
</noscript>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* =============================================================
   Motion layer — SD UDYOG
   Movement follows the ledger idea: things are ruled, stamped and
   tallied rather than floated. Every effect below is disabled by the
   reduced-motion block at the bottom of this file.
   ============================================================= */

/* ---- keyframes ---- */
@keyframes sd-fade-up      { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }
@keyframes sd-fade-in      { from { opacity:0 } to { opacity:1 } }
@keyframes sd-slide-left   { from { opacity:0; transform:translateX(34px) } to { opacity:1; transform:none } }
@keyframes sd-slide-right  { from { opacity:0; transform:translateX(-34px) } to { opacity:1; transform:none } }
@keyframes sd-pop          { 0%{opacity:0;transform:scale(.86)} 60%{opacity:1;transform:scale(1.04)} 100%{transform:scale(1)} }
@keyframes sd-stamp        { 0%{opacity:0;transform:scale(1.5) rotate(-8deg)} 55%{opacity:1;transform:scale(.94) rotate(1deg)} 100%{opacity:1;transform:none} }
@keyframes sd-rule-draw    { from { transform:scaleX(0) } to { transform:scaleX(1) } }
@keyframes sd-mark-grow    { from { transform:scaleY(0) } to { transform:scaleY(1) } }
@keyframes sd-tick-pop     { 0%{transform:scaleY(.4)} 55%{transform:scaleY(1.5)} 100%{transform:scaleY(1)} }
@keyframes sd-ring         { 0%{transform:scale(.7);opacity:.55} 100%{transform:scale(2.1);opacity:0} }
@keyframes sd-sweep        { from { background-position:-140% 0 } to { background-position:140% 0 } }
@keyframes sd-float-in     { from { opacity:0; transform:translateY(8px) scale(.98) } to { opacity:1; transform:none } }
@keyframes sd-shake        { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@keyframes sd-spin         { to { transform:rotate(360deg) } }

/* ---- scroll reveal ----
   Elements are only pre-hidden once JS has confirmed it is running, so
   the page is fully readable without scripts or with an old browser. */
.js .reveal { opacity:0; transform:translateY(16px) }
.js .reveal.in {
  animation: sd-fade-up .55s cubic-bezier(.22,.7,.3,1) both;
  animation-delay: var(--d, 0ms);
}
/* Staggered children: each child leaves a beat after the last. */
.js .stagger > * { opacity:0 }
.js .stagger.in > * { animation: sd-fade-up .5s cubic-bezier(.22,.7,.3,1) both }
.js .stagger.in > *:nth-child(1){animation-delay:.00s} .js .stagger.in > *:nth-child(2){animation-delay:.06s}
.js .stagger.in > *:nth-child(3){animation-delay:.12s} .js .stagger.in > *:nth-child(4){animation-delay:.18s}
.js .stagger.in > *:nth-child(5){animation-delay:.24s} .js .stagger.in > *:nth-child(6){animation-delay:.30s}
.js .stagger.in > *:nth-child(7){animation-delay:.36s} .js .stagger.in > *:nth-child(8){animation-delay:.42s}
.js .stagger.in > *:nth-child(n+9){animation-delay:.48s}

/* ---- view transition ---- */
.view-enter { animation: sd-fade-up .4s cubic-bezier(.22,.7,.3,1) both }

/* ---- brand mark ---- */
.wordmark::before { animation: sd-mark-grow .5s cubic-bezier(.2,.8,.2,1) both; transform-origin: bottom }
.wordmark { transition: transform .18s ease }
.wordmark:hover::before { animation: sd-tick-pop .4s ease }
.wordmark .sd-tag {
  font-family: var(--font-mono); font-weight: 600; letter-spacing: .04em;
  color: var(--haldi);
}
.brand-sub {
  display:block; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:400; margin-top:-2px;
}

/* ---- hero ---- */
.hero .eyebrow { animation: sd-fade-in .5s both }
.hero h1 { animation: sd-fade-up .6s cubic-bezier(.22,.7,.3,1) both; animation-delay:.08s }
.hero .lede { animation: sd-fade-up .6s cubic-bezier(.22,.7,.3,1) both; animation-delay:.18s }
.hero + .rule-double { animation: sd-rule-draw .7s cubic-bezier(.7,0,.3,1) both; animation-delay:.28s; transform-origin:left }

/* ---- buttons ---- */
.btn { position:relative; overflow:hidden; transition:background .15s ease,color .15s ease,border-color .15s ease,transform .12s ease,box-shadow .15s ease }
.btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 2px 10px rgba(18,49,43,.10) }
.btn:active:not(:disabled) { transform:translateY(0) scale(.985) }
/* ink ripple, stamped from the click point */
.btn .sd-ripple {
  position:absolute; border-radius:50%; pointer-events:none;
  background:currentColor; opacity:.22; transform:scale(0);
  animation: sd-ring .55s ease-out forwards;
}
.btn-primary .sd-ripple, .btn-accent .sd-ripple { background:var(--paper) }

/* ---- assessment list ---- */
.assess-item { transition: background .2s ease }
.assess-item:hover { background:var(--surface) }
.assess-item h2 { transition: transform .2s ease }
.assess-item:hover h2 { transform: translateX(3px) }

/* ---- questionnaire ---- */
.q-card.enter-next { animation: sd-slide-left .34s cubic-bezier(.22,.7,.3,1) both }
.q-card.enter-prev { animation: sd-slide-right .34s cubic-bezier(.22,.7,.3,1) both }
.q-card .opts .opt, .q-card .rating label { animation: sd-fade-up .34s cubic-bezier(.22,.7,.3,1) both }
.q-card .opts .opt:nth-child(1),.q-card .rating label:nth-child(1){animation-delay:.05s}
.q-card .opts .opt:nth-child(2),.q-card .rating label:nth-child(2){animation-delay:.10s}
.q-card .opts .opt:nth-child(3),.q-card .rating label:nth-child(3){animation-delay:.15s}
.q-card .opts .opt:nth-child(4),.q-card .rating label:nth-child(4){animation-delay:.20s}
.q-card .opts .opt:nth-child(5),.q-card .rating label:nth-child(5){animation-delay:.25s}
.q-card .opts .opt:nth-child(n+6),.q-card .rating label:nth-child(n+6){animation-delay:.30s}
.opt { transition: border-color .15s ease, background .15s ease, transform .12s ease }
.opt:hover { transform: translateX(3px) }
.opt:active { transform: scale(.995) }
.opt .mark { transition: background .18s ease, border-color .18s ease }
.opt input:checked ~ .mark { animation: sd-pop .28s cubic-bezier(.2,.8,.2,1) }
.opt.just-picked { animation: sd-pop .3s ease }
.rating label:has(input:checked) { animation: sd-pop .28s cubic-bezier(.2,.8,.2,1) }
.q-ticks i { transition: background .25s ease, transform .2s ease; transform-origin:center }
.q-ticks i.bump { animation: sd-tick-pop .35s cubic-bezier(.2,.8,.2,1) }
.q-count b { display:inline-block; transition: transform .2s ease }
.q-count b.bump { animation: sd-pop .3s ease }
.save-state { transition: opacity .3s ease }
.q-map button { transition: transform .12s ease, background .2s ease }
.q-map button:hover { transform: scale(1.08) }

/* ---- result ---- */
.result-total .figure { animation: sd-pop .7s cubic-bezier(.2,.8,.2,1) both; display:inline-block }
.result-total .fraction { animation: sd-fade-in .5s both; animation-delay:.45s }
.result-total .band { animation: sd-stamp .6s cubic-bezier(.2,.8,.2,1) both; animation-delay:.55s }
.result-total > p { animation: sd-fade-up .5s both; animation-delay:.7s }
.ledger-bar > i { transition: width .9s cubic-bezier(.2,.75,.25,1) }
.fb-card { transition: transform .2s ease, box-shadow .2s ease }
.fb-card:hover { transform: translateY(-2px); box-shadow: var(--shadow) }
.fb-recommend { animation: sd-fade-up .5s both }

/* ---- admin ---- */
.kpi { transition: background .2s ease, transform .18s ease }
.kpi:hover { background: var(--surface-2) }
.kpi-value { display:inline-block }
.chart-panel { transition: box-shadow .25s ease, transform .2s ease }
.chart-panel:hover { box-shadow: var(--shadow) }
.side-nav button { transition: background .18s ease, color .18s ease, padding-inline-start .18s ease }
.side-nav button:hover { padding-inline-start: 1.05rem }
.side-nav button[aria-current="page"] .nav-mark { color: var(--haldi) }
table.data tbody tr { transition: background .15s ease }
.sw-card { transition: transform .2s ease }
.sw-card:hover { transform: translateY(-2px) }
.pill, .tag { transition: transform .15s ease }
.sw-card:hover .figure { animation: sd-pop .35s ease }

/* ---- dialogs & toasts ---- */
dialog[open] { animation: sd-float-in .28s cubic-bezier(.22,.7,.3,1) both }
dialog::backdrop { animation: sd-fade-in .25s both }
.err-text:not(:empty) { animation: sd-shake .4s ease both }

/* ---- busy indicator ---- */
.sd-spinner {
  width:1em; height:1em; border:2px solid currentColor; border-top-color:transparent;
  border-radius:50%; display:inline-block; animation: sd-spin .7s linear infinite;
}
.sd-sweep {
  background:linear-gradient(90deg,transparent 0%,var(--haldi-soft) 45%,transparent 90%);
  background-size:200% 100%; animation: sd-sweep 1.1s ease-in-out infinite;
}

/* ---- honour the user's motion preference ---- */
@media (prefers-reduced-motion: reduce) {
  .js .reveal, .js .stagger > * { opacity:1 !important; transform:none !important; animation:none !important }
  .view-enter, .q-card.enter-next, .q-card.enter-prev, .q-card .opts .opt, .q-card .rating label,
  .hero .eyebrow, .hero h1, .hero .lede, .hero + .rule-double,
  .result-total .figure, .result-total .fraction, .result-total .band, .result-total > p,
  .wordmark::before, dialog[open], dialog::backdrop, .fb-recommend {
    animation: none !important; opacity:1 !important; transform:none !important;
  }
  .btn:hover:not(:disabled), .opt:hover, .assess-item:hover h2,
  .fb-card:hover, .sw-card:hover, .q-map button:hover, .side-nav button:hover {
    transform: none !important;
  }
  .btn .sd-ripple, .sd-spinner, .sd-sweep { animation: none !important; display:none }
  .ledger-bar > i { transition: none !important }
}

// ---------------------------------------------------------------
// DOM helpers. `el` sets text via textContent only and refuses an

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'text') n.textContent = v;
    else if (k === 'class') n.className = v;
    else if (k === 'html') throw new Error('raw html is not allowed');
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };

const GU = ['૦','૧','૨','૩','૪','૫','૬','૭','૮','૯'];
const guNum = (n) => String(n).replace(/[0-9]/g, d => GU[+d]);

const intFmt = (n) => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('en-IN');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('gu-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleString('gu-IN',
    { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtDuration(sec) {
  if (sec === null || sec === undefined) return '—';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m ? `${m} મિ ${s} સે` : `${s} સેકન્ડ`;
}
function toast(msg, kind, ms = 4000) {
  let stack = $('.toast-stack');
  if (!stack) { stack = el('div', { class: 'toast-stack', role: 'status', 'aria-live': 'polite' }); document.body.append(stack); }
  const t = el('div', { class: kind === 'error' ? 'toast toast-error' : 'toast', text: msg });
  stack.append(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 220); }, ms);
}
function ledgerRow(label, figure, fill, color) {
  return el('li', { class: 'ledger-row' }, [

}
function confirmDialog({ title, message, confirmLabel = 'હા, ચાલુ રાખો', cancelLabel = 'રદ કરો', danger }) {
  return new Promise((resolve) => {
    // The answer is recorded before close() so that dismissing the dialog
    // (Escape, backdrop) cannot overwrite a deliberate choice, whether the
    // close event fires synchronously or asynchronously.
    let answer = false, settled = false;
    const finish = () => { if (settled) return; settled = true; dlg.remove(); resolve(answer); };
    const dlg = el('dialog', {}, [
      el('h2', { text: title }), el('p', { text: message }),
      el('div', { class: 'dialog-actions' }, [
        el('button', { class: 'btn btn-quiet', type: 'button', text: cancelLabel,
          onclick: () => { answer = false; dlg.close(); } }),
        el('button', { class: danger ? 'btn btn-danger' : 'btn btn-primary', type: 'button', text: confirmLabel,
          onclick: () => { answer = true; dlg.close(); } })
      ])
    ]);
    dlg.addEventListener('close', finish, { once: true });
    document.body.append(dlg); dlg.showModal();
  });
}

// ---------------------------------------------------------------
// Storage. Falls back to memory when localStorage is unavailable
// (private mode, sandboxed iframe) so the app still runs.
// ---------------------------------------------------------------
const Store = (function () {
  const mem = {};
  let ok = true;
  try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); }
  catch (e) { ok = false; }
  return {
    persistent: ok,
    get(key, fallback) {
      try {
        const raw = ok ? localStorage.getItem(key) : mem[key];
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) { return fallback; }
    },
    set(key, value) {
      const raw = JSON.stringify(value);
      try { if (ok) localStorage.setItem(key, raw); else mem[key] = raw; }
      catch (e) { mem[key] = raw; }
    },
    del(key) { try { if (ok) localStorage.removeItem(key); else delete mem[key]; } catch (e) {} }
  };
})();

// ---------------------------------------------------------------
// Motion helpers. Everything checks the user's motion preference and
// falls back to an instant, complete result when motion is reduced.
// ---------------------------------------------------------------
const motionOK = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Count a number up into place. Always ends on the exact value. */
function countUp(node, to, { decimals = 0, suffix = '', duration = 750 } = {}) {
  const final = Number(to).toFixed(decimals) + suffix;
  if (!motionOK() || typeof requestAnimationFrame !== 'function') { node.textContent = final; return; }
  const start = performance.now();
  const from = 0;
  const step = (now) => {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = (from + (to - from) * eased).toFixed(decimals) + suffix;
    if (t < 1) requestAnimationFrame(step);
    else node.textContent = final;
  };
  node.textContent = (0).toFixed(decimals) + suffix;
  requestAnimationFrame(step);
}

/** Reveal [data-reveal] elements as they scroll into view. */
let revealObserver = null;
function initReveal(root) {
  const targets = $$('.reveal, .stagger', root || document);
  if (!targets.length) return;
  if (!motionOK() || typeof IntersectionObserver !== 'function') {
    targets.forEach(t => t.classList.add('in'));
    return;
  }
  if (!revealObserver) {
    revealObserver = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) { e.target.classList.add('in'); revealObserver.unobserve(e.target); }
      }
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  }
  targets.forEach(t => {
    // Anything already on screen at paint time reveals immediately, so the
    // first fold never sits blank waiting for a scroll.
    const box = t.getBoundingClientRect();
    if (box.top < (window.innerHeight || 800)) t.classList.add('in');
    else revealObserver.observe(t);
  });
  // Safety net: content must never stay invisible because an observer
  // failed to fire. After a few seconds, reveal whatever is left.
  setTimeout(() => targets.forEach(t => t.classList.add('in')), 3000);
}

/** Ink ripple stamped from the pointer position. */
function attachRipples(root) {
  (root || document).addEventListener('click', (e) => {
    const btn = e.target.closest ? e.target.closest('.btn') : null;
    if (!btn || btn.disabled || !motionOK()) return;
    const box = btn.getBoundingClientRect();
    const size = Math.max(box.width, box.height) * 1.1;
    const dot = el('span', { class: 'sd-ripple', style: {
      width: size + 'px', height: size + 'px',
      left: ((e.clientX || box.left + box.width / 2) - box.left - size / 2) + 'px',
      top: ((e.clientY || box.top + box.height / 2) - box.top - size / 2) + 'px'
    } });
    btn.append(dot);
    setTimeout(() => dot.remove(), 600);
  }, true);
}

/** Briefly flag an element so a CSS animation can replay. */
function bump(node, cls = 'bump', ms = 400) {
  if (!node || !motionOK()) return;
  node.classList.remove(cls);
  void node.offsetWidth;   // force reflow so the animation restarts
  node.classList.add(cls);
  setTimeout(() => node.classList.remove(cls), ms);
}

const CAT = new Map(SEED.categories.map(c => [c.id, c]));
const SEC = new Map(SEED.sections.map(s => [s.id, s]));

let questions = Store.get(KEY.Q, null) || SEED.questions.map(q => JSON.parse(JSON.stringify(q)));
let responses = Store.get(KEY.RESP, []);

// ---------------------------------------------------------------
// Scoring — mirrors server/scoring.js exactly
// ---------------------------------------------------------------
function maxForQuestion(q) {
  if (q.type === 'rating') return round2(q.rmax * q.w);
  if (q.type === 'multi') return round2(q.opts.reduce((s, o) => s + Math.max(0, o.s), 0) * q.w);
  return round2(Math.max(...q.opts.map(o => o.s)) * q.w);
}
function scoreOne(q, answer) {
  if (!answer) return 0;
  if (q.type === 'rating') {
    const v = Number(answer.value);
    if (isNaN(v)) return 0;
    return round2(Math.max(q.rmin, Math.min(q.rmax, v)) * q.w);
  }
  const ids = answer.option_ids || [];
  const valid = q.opts.filter(o => ids.includes(o.id));
  if (!valid.length) return 0;
  if (q.type === 'multi') return round2(valid.reduce((s, o) => s + o.s, 0) * q.w);
  return round2(valid[0].s * q.w);
}
/** Grade a full answer set. The answers are the only input; nothing
 *  score-shaped from the form is trusted. */
function grade(answers) {
  let total = 0, max = 0;
  const cats = new Map(), secs = new Map();
  for (const q of questions) {
    const got = scoreOne(q, answers[q.id]);
    const cap = maxForQuestion(q);
    total += got; max += cap;
    if (q.cat) {
      const c = cats.get(q.cat) || { obtained: 0, max: 0 };
      c.obtained += got; c.max += cap; cats.set(q.cat, c);
    }
    if (q.sec) {
      const s = secs.get(q.sec) || { obtained: 0, max: 0 };
      s.obtained += got; s.max += cap; secs.set(q.sec, s);
    }
  }
  total = round2(total); max = round2(max);
  const percentage = max > 0 ? round2((total / max) * 100) : 0;
  const band = SEED.bands.find(b => percentage >= b.min && percentage <= b.max) || SEED.bands[SEED.bands.length - 1];
  const catRows = [...cats.entries()].map(([id, v]) => ({
    id, name: CAT.get(id).name, color: CAT.get(id).color,
    obtained: round2(v.obtained), max: round2(v.max),
    percentage: v.max > 0 ? round2((v.obtained / v.max) * 100) : 0
  })).sort((a, b) => a.id - b.id);
  const secRows = [...secs.entries()].map(([id, v]) => ({
    id, label: SEC.get(id) ? SEC.get(id).title : '—',
    obtained: round2(v.obtained), max: round2(v.max),
    percentage: v.max > 0 ? round2((v.obtained / v.max) * 100) : 0
  })).sort((a, b) => a.id - b.id);
  return { total_score: total, max_score: max, percentage, band, categories: catRows, sections: secRows };
}
/** Rule-based feedback, mirroring server/feedback.js */
function buildFeedback(result) {
  const pick = (kind, catId, pctv) => SEED.feedback.filter(f =>
    f.kind === kind && f.cat === catId && pctv >= f.min && pctv <= f.max);
  const strengths = [], improvements = [];
  for (const c of result.categories) {
    if (c.percentage >= 70) {
      for (const r of pick('strength', c.id, c.percentage))
        strengths.push({ category: c.name, percentage: c.percentage, text: r.text });
    }
    if (c.percentage <= 60) {
      for (const r of pick('improve', c.id, c.percentage))
        improvements.push({ category: c.name, percentage: c.percentage, text: r.text });
    }
  }
  strengths.sort((a, b) => b.percentage - a.percentage);
  improvements.sort((a, b) => a.percentage - b.percentage);
  const rec = SEED.feedback.find(f => f.kind === 'recommend' && f.cat === null &&
    result.percentage >= f.min && result.percentage <= f.max);
  return { strengths, improvements, recommendation: rec ? rec.text : '' };
}

function wrapLabel(text, limit = 14) {
  if (text.length <= limit) return text;
  const words = String(text).split(' ');
  if (words.length === 1) return text;
  const lines = [''];
  for (const w of words) {
    const cur = lines[lines.length - 1];
    if (cur && (cur + ' ' + w).length > limit) lines.push(w);
    else lines[lines.length - 1] = cur ? cur + ' ' + w : w;
  }
  return lines;
}

      ctx.fillStyle = p.ink;
      ctx.font = "600 30px 'IBM Plex Mono', monospace";
      ctx.fillText(String(typeof getText === 'function' ? getText() : getText),
        (chartArea.left + chartArea.right) / 2, (chartArea.top + chartArea.bottom) / 2);
      ctx.restore();
    }
  };
}

  /** A dataset with yAxisID 'y1' is drawn against a right-hand 0–100 axis,

  line(canvas, labels, datasets, { suffix = '', rightSuffix = '%' } = {}) {

const FIRST_M = ['રાજેશ','અમિત','કિરણ','હાર્દિક','જયેશ','નિલેશ','પ્રકાશ','સંજય','વિપુલ','ધર્મેશ','મેહુલ','ભાવેશ','ચિરાગ','તુષાર','અશોક'];
const FIRST_F = ['પ્રિયા','નેહા','કૃપા','હેતલ','દર્શના','મીરા','પૂજા','શ્વેતા','રીના','ભાવના','જાગૃતિ','સોનલ','ઉર્વશી','દીપ્તિ'];
const LAST = ['પટેલ','શાહ','દેસાઈ','મહેતા','જોષી','ત્રિવેદી','ચૌહાણ','પરમાર','સોલંકી','રાવલ','ઠક્કર','વ્યાસ','દવે','પંડ્યા','ગોહિલ'];
const CITIES = ['આણંદ','વડોદરા','અમદાવાદ','સુરત','રાજકોટ','ભાવનગર','નડિયાદ','ખેડા','ભરૂચ','જૂનાગઢ','ગાંધીનગર','મહેસાણા','પાટણ','વલસાડ'];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function generateDemo(count, seed) {
  const rnd = mulberry32(seed || 20260820);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const optionsFor = (key) => (SEED.fields.find(f => f.key === key) || {}).options || [];
  const made = [];
  const now = Date.now();

  for (let i = 0; i < count; i++) {
    // Skill drives answer quality; the wide band keeps every result
    // level populated instead of bunching everyone at the top.
    const skill = 0.05 + rnd() * 0.80;
    const female = rnd() < 0.42;
    const gender = female ? 'સ્ત્રી' : 'પુરુષ';
    const answers = {};
    for (const q of questions) {
      const noise = (rnd() - 0.5) * 0.35;
      const level = Math.max(0, Math.min(1, skill + noise));
      if (q.type === 'rating') {
        answers[q.id] = { value: Math.round(q.rmin + level * (q.rmax - q.rmin)) };
      } else if (q.type === 'multi') {
        const sorted = q.opts.slice().sort((a, b) => b.s - a.s);
        const take = Math.max(1, Math.round(level * sorted.length));
        answers[q.id] = { option_ids: sorted.slice(0, take).map(o => o.id) };
      } else {
        const sorted = q.opts.slice().sort((a, b) => a.s - b.s);
        const idx = Math.min(sorted.length - 1, Math.floor(level * sorted.length));
        answers[q.id] = { option_ids: [sorted[idx].id] };
      }
    }
    const result = grade(answers);
    const daysAgo = Math.floor(rnd() * 75);
    const submitted = new Date(now - daysAgo * 864e5 - Math.floor(rnd() * 864e5)).toISOString();
    made.push({
      id: uid(), is_demo: true,
      profile: {
        full_name: `${female ? pick(FIRST_F) : pick(FIRST_M)} ${pick(LAST)}`,
        age: 20 + Math.floor(rnd() * 35),
        gender,
        education: pick(optionsFor('education')),
        occupation: pick(optionsFor('occupation')),
        experience: pick(optionsFor('experience')),
        business_type: pick(optionsFor('business_type')),
        city: pick(CITIES)
      },
      answers, result,
      submitted_at: submitted,
      duration_seconds: 240 + Math.floor(rnd() * 900)
    });
  }
  responses = responses.concat(made);
  saveResponses();
  return made.length;
}

function applyFilters(f) {
  return responses.filter(r => {
    if (!f.include_demo && r.is_demo) return false;
    if (f.gender && r.profile.gender !== f.gender) return false;
    if (f.education && r.profile.education !== f.education) return false;
    if (f.experience && r.profile.experience !== f.experience) return false;
    if (f.business_type && r.profile.business_type !== f.business_type) return false;
    if (f.city && r.profile.city !== f.city) return false;
    if (f.age_min && !(r.profile.age >= Number(f.age_min))) return false;
    if (f.age_max && !(r.profile.age <= Number(f.age_max))) return false;
    if (f.date_from && r.submitted_at.slice(0, 10) < f.date_from) return false;
    if (f.date_to && r.submitted_at.slice(0, 10) > f.date_to) return false;
    if (f.search) {
      const hay = [r.profile.full_name, r.profile.city, r.profile.education].join(' ').toLowerCase();
      if (!hay.includes(String(f.search).toLowerCase())) return false;

function kpis(rows) {
  if (!rows.length) return { n: 0, avg: 0, min: 0, max: 0, avgMin: 0, bands: [] };
  const p = rows.map(r => r.result.percentage);
  const bands = SEED.bands.map(b => ({ label: b.label, color: b.color,
    n: rows.filter(r => r.result.band && r.result.band.label === b.label).length }));
  return {
    n: rows.length,
    avg: round2(p.reduce((s, x) => s + x, 0) / p.length),
    min: Math.min(...p), max: Math.max(...p),
    avgMin: Math.round(rows.reduce((s, r) => s + (r.duration_seconds || 0), 0) / rows.length / 60),
    bands

}
function trendOf(rows, grain) {
  const bucket = (iso) => {
    const d = new Date(iso);
    if (grain === 'monthly') return iso.slice(0, 7);
    if (grain === 'weekly') {
      const t = new Date(d); t.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return t.toISOString().slice(0, 10);
    }
    return iso.slice(0, 10);
  };
  const map = new Map();
  for (const r of rows) {
    const k = bucket(r.submitted_at);
    const v = map.get(k) || { n: 0, sum: 0 };
    v.n++; v.sum += r.result.percentage; map.set(k, v);
  }
  return [...map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1)
    .map(([k, v]) => ({ bucket: k, n: v.n, avg: round2(v.sum / v.n) }));
}
function categoryPerf(rows) {
  return SEED.categories.map(c => {
    const vals = rows.map(r => (r.result.categories.find(x => x.id === c.id) || {}).percentage)
                     .filter(v => v !== undefined);
    const avg = vals.length ? round2(vals.reduce((s, x) => s + x, 0) / vals.length) : 0;
    return {
      id: c.id, label: c.name, color: c.color, avg, total: vals.length,
      strong: vals.length ? Math.round(vals.filter(v => v >= 70).length / vals.length * 100) : 0,
      weak: vals.length ? Math.round(vals.filter(v => v <= 60).length / vals.length * 100) : 0

function breakdown(rows, dimKey) {
  const dim = DIMENSIONS.find(d => d.key === dimKey) || DIMENSIONS[0];
  const map = new Map();
  for (const r of rows) {
    const k = dim.of(r);
    const v = map.get(k) || { n: 0, sum: 0 };
    v.n++; v.sum += r.result.percentage; map.set(k, v);
  }
  return { dim, rows: [...map.entries()].map(([label, v]) => ({ label, n: v.n, avg: round2(v.sum / v.n) }))
    .sort((a, b) => b.n - a.n) };
}
function distinctValues(key) {
  const dim = DIMENSIONS.find(d => d.key === key);
  return [...new Set(responses.map(dim.of))].filter(v => v && v !== 'અજ્ઞાત').sort();
}

// ---------------------------------------------------------------
// CSV export — UTF-8 BOM so Excel reads Gujarati, and cells starting
// with = + - @ are neutralised against formula injection.
// ---------------------------------------------------------------
function csvCell(v) {
  let s = v === null || v === undefined ? '' : String(v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function download(filename, text) {
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportResponses(rows) {
  const head = ['ક્રમ','નામ','ઉંમર','લિંગ','શૈક્ષણિક લાયકાત','વ્યવસાયિક સ્થિતિ','અનુભવ','વ્યવસાયનો પ્રકાર',
    'શહેર','કુલ ગુણ','મહત્તમ ગુણ','ટકાવારી','પરિણામ સ્તર','સમય (સેકન્ડ)','તારીખ','ડેમો']
    .concat(SEED.categories.map(c => c.name + ' %'));
  const lines = [head.map(csvCell).join(',')];
  rows.forEach((r, i) => {
    const p = r.profile;
    lines.push([i + 1, p.full_name, p.age, p.gender, p.education, p.occupation, p.experience,
      p.business_type, p.city, r.result.total_score, r.result.max_score, r.result.percentage,
      r.result.band ? r.result.band.label : '', r.duration_seconds, r.submitted_at, r.is_demo ? 'હા' : 'ના']
      .concat(SEED.categories.map(c => {
        const cc = r.result.categories.find(x => x.id === c.id);
        return cc ? cc.percentage : '';
      })).map(csvCell).join(','));
  });
  download('udyog-responses.csv', lines.join('\n'));
}
function exportAnswers(rows) {
  const lines = [['પ્રતિભાગી','પ્રશ્ન','કેટેગરી','જવાબ','ગુણ','મહત્તમ'].map(csvCell).join(',')];
  for (const r of rows) {
    for (const q of questions) {
      const a = r.answers[q.id];
      if (!a) continue;
      const label = q.type === 'rating' ? String(a.value)
        : q.opts.filter(o => (a.option_ids || []).includes(o.id)).map(o => o.l).join(' | ');
      lines.push([r.profile.full_name, q.text, q.cat ? CAT.get(q.cat).name : '',
        label, scoreOne(q, a), maxForQuestion(q)].map(csvCell).join(','));
    }
  }
  download('udyog-answers.csv', lines.join('\n'));
}
function exportCategories(rows) {
  const perf = categoryPerf(rows);
  const lines = [['કેટેગરી','સરેરાશ %','મજબૂત %','નબળા %','પ્રતિસાદ'].map(csvCell).join(',')];
  for (const c of perf) lines.push([c.label, c.avg, c.strong, c.weak, c.total].map(csvCell).join(','));
  download('udyog-categories.csv', lines.join('\n'));
}

function openIntake() {
  const form = el('div', { class: 'grid-2' });
  for (const f of SEED.fields) {
    const id = 'f-' + f.key;
    let input;
    if (f.type === 'select') {
      input = el('select', { id, name: f.key }, [el('option', { value: '', text: '— પસંદ કરો —' }),
        ...f.options.map(o => el('option', { value: o, text: o }))]);
    } else {
      input = el('input', { id, name: f.key, type: f.type === 'number' ? 'number' : f.type,
        min: f.type === 'number' ? 10 : null, max: f.type === 'number' ? 100 : null,
        inputmode: f.type === 'number' ? 'numeric' : null,
        autocomplete: f.key === 'full_name' ? 'name' : f.key === 'email' ? 'email' : f.key === 'mobile' ? 'tel' : 'off' });
    }
    form.append(el('div', { class: 'field' }, [
      el('label', { for: id }, [f.label, f.req ? el('span', { class: 'req', text: ' *' }) : null]), input
    ]));
  }
  const consent = el('input', { type: 'checkbox', id: 'consent' });
  const err = el('div', { class: 'err-text', role: 'alert' });
  const start = el('button', { class: 'btn btn-primary', type: 'button', text: 'મૂલ્યાંકન શરૂ કરો' });

  start.addEventListener('click', () => {
    err.textContent = '';
    const profile = {};
    for (const f of SEED.fields) {
      const node = form.querySelector('[name="' + f.key + '"]');
      const v = node ? node.value.trim() : '';
      if (f.req && !v) { err.textContent = f.label + ' ભરવું જરૂરી છે.'; node && node.focus(); return; }
      if (v) profile[f.key] = f.type === 'number' ? Number(v) : v;
    }
    if (!consent.checked) { err.textContent = 'આગળ વધવા માટે સંમતિ આપવી જરૂરી છે.'; return; }
    Store.set(KEY.DRAFT, { profile, answers: {}, started_at: new Date().toISOString() });
    dlg.close();
    go('#/quiz');
  });

  const dlg = el('dialog', {}, [
    el('span', { class: 'eyebrow', text: 'પગલું ૧ / ૨' }),
    el('h2', { text: BRAND.titleGu }),
    el('p', { class: 'hint', text: 'નીચેની માહિતી માત્ર તમારું પરિણામ તૈયાર કરવા માટે વપરાશે. તારાંકિત (*) ક્ષેત્રો સિવાય બધું વૈકલ્પિક છે.' }),
    el('hr', { class: 'rule' }), form, el('hr', { class: 'rule' }),
    el('label', { class: 'checkline', for: 'consent' }, [consent,
      el('span', { text: 'મારી માહિતી પરિણામ તૈયાર કરવા માટે વાપરવા હું સંમતિ આપું છું.' })]),
    err,
    el('div', { class: 'dialog-actions' }, [
      el('button', { class: 'btn btn-quiet', type: 'button', text: 'રદ કરો', onclick: () => dlg.close() }), start
    ])
  ]);
  dlg.addEventListener('close', () => dlg.remove(), { once: true });
  document.body.append(dlg); dlg.showModal();

}

function ViewQuiz() {
  const draft = Store.get(KEY.DRAFT, null);
  if (!draft) { go('#/'); return; }
  let index = 0, showMissing = false, lastIndex = 0;
  const answers = draft.answers || {};
  const isAnswered = (q) => {
    const a = answers[q.id];
    if (!a) return false;
    return q.type === 'rating' ? (a.value !== undefined && a.value !== null)
      : Array.isArray(a.option_ids) && a.option_ids.length > 0;
  };
  const persist = () => { draft.answers = answers; Store.set(KEY.DRAFT, draft); };

  const ticks = el('div', { class: 'q-ticks', id: 'ticks', role: 'progressbar',
    'aria-label': 'મૂલ્યાંકનની પ્રગતિ', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': 0 },
    questions.map(() => el('i')));
  const counter = el('div', { class: 'q-count' }, [
    'પ્રશ્ન ', el('b', { id: 'cur', text: '૧' }), ' / ', guNum(questions.length)]);
  const stage = el('main', { class: 'q-stage', id: 'stage' });

  function updateTicks() {
    const done = questions.filter(isAnswered).length;
    ticks.setAttribute('aria-valuenow', String(Math.round(done / questions.length * 100)));
    Array.from(ticks.children).forEach((t, i) => {
      const q = questions[i];
      const next = i === index ? 'current' : isAnswered(q) ? 'done'
        : (showMissing && q.req) ? 'missing' : '';
      if (t.dataset.state !== next && next === 'done') bump(t);
      t.dataset.state = next;
    });
    const cur = $('#cur');
    if (cur) {
      if (cur.textContent !== guNum(index + 1)) bump(cur);
      cur.textContent = guNum(index + 1);
    }
  }
  function render() {
    const q = questions[index];
    clear(stage);
    // Cards travel in the direction of navigation, so moving back feels
    // like stepping back through the ledger rather than forward again.
    const dir = index >= lastIndex ? 'enter-next' : 'enter-prev';
    lastIndex = index;
    const card = el('div', { class: 'q-card ' + dir });
    const sec = q.sec ? SEC.get(q.sec) : null;
    if (sec) card.append(el('span', { class: 'eyebrow', text: sec.title }));
    if (q.scenario) card.append(el('div', { class: 'q-scenario' }, [
      el('strong', { text: 'પરિસ્થિતિ: ' }), q.scenario]));
    card.append(el('h1', { class: 'q-text', id: 'qtext', text: q.text }));
    if (q.help) card.append(el('p', { class: 'q-help', text: q.help }));
    card.append(q.type === 'rating' ? ratingCtl(q) : optionCtl(q));
    if (showMissing && q.req && !isAnswered(q))
      card.append(el('div', { class: 'err-text', role: 'alert', text: 'આ પ્રશ્નનો જવાબ આપવો જરૂરી છે.' }));

    const last = index === questions.length - 1;
    card.append(el('div', { class: 'q-nav' }, [
      el('button', { class: 'btn btn-quiet', type: 'button', text: '← પાછળ',
        disabled: index === 0, onclick: () => { index--; render(); } }),
      el('span', { class: 'save-state', id: 'saved' }),
      el('span', { class: 'spacer' }),
      last ? el('button', { class: 'btn btn-accent', type: 'button', text: 'મૂલ્યાંકન પૂર્ણ કરો', onclick: submit })
           : el('button', { class: 'btn btn-primary', type: 'button', text: 'આગળ →', onclick: () => { index++; render(); } })
    ]));
    stage.append(card);
    updateTicks();
    window.scrollTo(0, 0);
  }
  function flashSaved() {
    const n = $('#saved');
    if (!n) return;
    n.textContent = 'સચવાયું ✓';
    setTimeout(() => { if (n.isConnected) n.textContent = ''; }, 1600);
  }
  function optionCtl(q) {
    const multi = q.type === 'multi';
    const box = el('div', { class: 'opts', role: multi ? 'group' : 'radiogroup', 'aria-labelledby': 'qtext' });
    const cur = (answers[q.id] || {}).option_ids || [];
    for (const o of q.opts) {
      const input = el('input', { type: multi ? 'checkbox' : 'radio', name: 'q' + q.id,
        value: o.id, checked: cur.includes(o.id) });
      input.addEventListener('change', () => {
        if (multi) {
          answers[q.id] = { option_ids: $$('input:checked', box).map(i => Number(i.value)) };
        } else {
          answers[q.id] = { option_ids: [o.id] };
        }
        persist(); flashSaved(); updateTicks();
        bump(input.closest('.opt'), 'just-picked', 320);
        if (!multi && index < questions.length - 1) setTimeout(() => { index++; render(); }, 260);
      });
      box.append(el('label', { class: 'opt', dataset: { shape: multi ? 'check' : 'radio' } },
        [input, el('span', { class: 'mark' }), el('span', { text: o.l })]));
    }
    if (multi) box.append(el('p', { class: 'q-help', style: { marginTop: '.5rem' },
      text: 'એક કરતાં વધુ વિકલ્પ પસંદ કરી શકાય છે.' }));
    return box;
  }
  function ratingCtl(q) {
    const scale = el('div', { class: 'rating', role: 'radiogroup', 'aria-labelledby': 'qtext' });
    const cur = (answers[q.id] || {}).value;
    for (let v = q.rmin; v <= q.rmax; v++) {
      const input = el('input', { type: 'radio', name: 'q' + q.id, value: v, checked: Number(cur) === v });
      const val = v;
      input.addEventListener('change', () => {
        answers[q.id] = { value: val };
        persist(); flashSaved(); updateTicks();
        if (index < questions.length - 1) setTimeout(() => { index++; render(); }, 260);
      });
      scale.append(el('label', {}, [input, el('span', { text: guNum(v) })]));
    }
    return el('div', {}, [scale, el('div', { class: 'rating-ends' }, [
      el('span', { text: guNum(q.rmin) + ' — ખૂબ ઓછું' }), el('span', { text: guNum(q.rmax) + ' — ખૂબ વધારે' })])]);
  }
  function openMap() {
    const grid = el('div', { class: 'q-map' }, questions.map((q, i) =>
      el('button', { type: 'button', text: guNum(i + 1),
        'aria-label': `પ્રશ્ન ${i + 1}${isAnswered(q) ? ', જવાબ અપાયો' : ', જવાબ બાકી'}`,
        dataset: { state: i === index ? 'current' : isAnswered(q) ? 'done' : (showMissing && q.req ? 'missing' : '') },
        onclick: () => { dlg.close(); index = i; render(); } })));
    const done = questions.filter(isAnswered).length;
    const dlg = el('dialog', {}, [
      el('span', { class: 'eyebrow', text: 'પ્રશ્ન યાદી' }),
      el('h2', { text: `${guNum(done)} / ${guNum(questions.length)} પૂર્ણ` }),
      el('p', { class: 'q-help', text: 'કોઈપણ પ્રશ્ન પર જવા માટે તેના નંબર પર ક્લિક કરો. લીલો = જવાબ અપાયો.' }),
      grid,
      el('div', { class: 'dialog-actions' }, [
        el('button', { class: 'btn btn-quiet', type: 'button', text: 'બંધ કરો', onclick: () => dlg.close() })])
    ]);
    dlg.addEventListener('close', () => dlg.remove(), { once: true });
    document.body.append(dlg); dlg.showModal();
  }
  async function submit() {
    const missing = questions.filter(q => q.req && !isAnswered(q));
    if (missing.length) {
      showMissing = true;
      toast(`${guNum(missing.length)} જરૂરી પ્રશ્નોના જવાબ બાકી છે.`, 'error');
      index = questions.indexOf(missing[0]);
      render();
      return;
    }
    const ok = await confirmDialog({
      title: 'મૂલ્યાંકન સબમિટ કરવું છે?',
      message: 'સબમિટ કર્યા પછી જવાબોમાં ફેરફાર થઈ શકશે નહીં. તમને તરત જ વિગતવાર પરિણામ મળશે.',
      confirmLabel: 'હા, સબમિટ કરો', cancelLabel: 'હજી તપાસવું છે'
    });
    if (!ok) return;
    const finishBtn = $$('.q-nav .btn').find(b => b.textContent.includes('પૂર્ણ'));
    if (finishBtn) {
      finishBtn.disabled = true;
      clear(finishBtn).append(el('span', { class: 'sd-spinner' }), 'ગણતરી ચાલુ છે…');
    }
    const started = new Date(draft.started_at).getTime();
    const rec = {
      id: uid(), is_demo: false, profile: draft.profile, answers,
      result: grade(answers),
      submitted_at: new Date().toISOString(),
      duration_seconds: Math.max(1, Math.round((Date.now() - started) / 1000))
    };
    responses.push(rec); saveResponses(); Store.del(KEY.DRAFT);
    go('#/result/' + rec.id);
  }

  clear(root()).append(
    el('div', { class: 'q-bar' }, [el('div', { class: 'q-bar-in' }, [
      counter, ticks,
      el('button', { class: 'btn btn-quiet btn-sm', type: 'button', text: 'યાદી', onclick: openMap })
    ])]),
    stage
  );
  const firstGap = questions.findIndex(q => !isAnswered(q));
  index = firstGap === -1 ? 0 : firstGap;
  render();
  if (Object.keys(answers).length) toast(`${guNum(Object.keys(answers).length)} જવાબ પુન:પ્રાપ્ત થયા.`);
}

function AdminParticipants(view) {
  const search = el('input', { type: 'search', placeholder: 'નામ કે શહેરથી શોધો…',
    value: adminState.filters.search || '' });
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') { adminState.filters.search = search.value.trim(); adminState.page = 1; AdminParticipants(view); }
  });
  clear(view).append(
    pageHead('પ્રતિભાગીઓ', 'બધા પ્રતિસાદ', [
      el('button', { class: 'btn btn-quiet btn-sm', type: 'button', text: 'CSV ડાઉનલોડ',
        onclick: () => exportResponses(applyFilters(adminState.filters)) })]),
    el('div', { class: 'field', style: { maxWidth: '28rem' } }, [search]),
    filterBar(() => AdminParticipants(view)));

  const all = applyFilters(adminState.filters).sort((a, b) => a.submitted_at < b.submitted_at ? 1 : -1);
  setCount(all.length);
  const size = 25, pages = Math.max(1, Math.ceil(all.length / size));
  adminState.page = Math.min(adminState.page, pages);
  const slice = all.slice((adminState.page - 1) * size, adminState.page * size);

  const body = el('div', { class: 'section-block' }, [responseTable(slice)]);
  if (pages > 1) body.append(el('div', { class: 'pager' }, [
    el('button', { class: 'btn btn-quiet btn-sm', type: 'button', text: '← પહેલાં',
      disabled: adminState.page <= 1, onclick: () => { adminState.page--; AdminParticipants(view); } }),
    el('span', { class: 'page-info', text: `પાનું ${adminState.page} / ${pages} · કુલ ${intFmt(all.length)}` }),
    el('button', { class: 'btn btn-quiet btn-sm', type: 'button', text: 'પછી →',
      disabled: adminState.page >= pages, onclick: () => { adminState.page++; AdminParticipants(view); } })
  ]));
  view.append(body);
}
