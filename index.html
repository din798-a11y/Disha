  function addOpt(o = { l: '', s: 1 }) {
    const label = el('input', { type: 'text', value: o.l, placeholder: 'વિકલ્પનું લખાણ' });
    const score = el('input', { type: 'number', value: o.s, step: '0.5', min: '-100', max: '100' });
    const entry = { label, score };
    optRows.push(entry);
    const row = el('div', { class: 'opt-edit-row' }, [label, score,
      el('button', { class: 'btn btn-danger btn-sm', type: 'button', text: '✕',
        onclick: () => { entry.removed = true; row.remove(); } })]);
    optBox.append(row);
  }
  const PRESETS = {
    likert: [['સંપૂર્ણ અસહમત',1],['અસહમત',2],['તટસ્થ',3],['સહમત',4],['સંપૂર્ણ સહમત',5]],
    single: [['ખૂબ ઓછું',1],['ઓછું',2],['મધ્યમ',3],['વધારે',4],['ખૂબ વધારે',5]],
    yesno: [['હા',5],['ના',1]]
  };
  if (existing && existing.opts && existing.opts.length) existing.opts.forEach(addOpt);
  else PRESETS.likert.forEach(([l, s]) => addOpt({ l, s }));

  const optSection = el('div', {}, [
    el('span', { class: 'label', text: 'વિકલ્પો અને ગુણ' }),
    el('div', { class: 'opt-edit-row', style: { fontSize: 'var(--step--1)', color: 'var(--ink-faint)' } },
      [el('span', { text: 'લખાણ' }), el('span', { text: 'ગુણ' }), el('span', {})]),
    optBox,
    el('div', { style: { display: 'flex', gap: '.5rem', marginTop: '.5rem', flexWrap: 'wrap' } }, [
      el('button', { class: 'btn btn-quiet btn-sm', type: 'button', text: '+ વિકલ્પ', onclick: () => addOpt() }),
      ...Object.entries(PRESETS).map(([k, preset]) => el('button', { class: 'btn btn-quiet btn-sm', type: 'button',
        text: QTYPES[k] + ' સેટ', onclick: () => {
          optRows.forEach(r => { r.removed = true; }); clear(optBox); optRows.length = 0;
          preset.forEach(([l, s]) => addOpt({ l, s }));
        } }))])
  ]);
  const ratingSection = el('div', { style: { display: 'none' } }, [
    el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.75rem' } }, [
      el('div', { class: 'field' }, [el('label', { for: 'q-rmin', text: 'ન્યૂનતમ' }), rmin]),
      el('div', { class: 'field' }, [el('label', { for: 'q-rmax', text: 'મહત્તમ' }), rmax])]),
    el('div', { class: 'hint', text: 'મહત્તમ કિંમત × વજન = આ પ્રશ્નનો મહત્તમ સ્કોર.' })]);
  const scnField = el('div', { class: 'field', style: { display: 'none' } },
    [el('label', { for: 'q-scn', text: 'પરિસ્થિતિનું વર્ણન' }), scenario]);
  function sync() {
    optSection.style.display = type.value === 'rating' ? 'none' : '';
    ratingSection.style.display = type.value === 'rating' ? '' : 'none';
    scnField.style.display = type.value === 'scenario' ? '' : 'none';
  }
  type.addEventListener('change', sync); sync();

  const err = el('div', { class: 'err-text', role: 'alert' });
  const dlg = el('dialog', { style: { maxWidth: 'min(44rem, calc(100vw - 2rem))' } }, [
    el('span', { class: 'eyebrow', text: existing ? 'સંપાદન' : 'નવો' }),
    el('h2', { text: existing ? 'પ્રશ્ન સંપાદિત કરો' : 'નવો પ્રશ્ન' }),
    el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.75rem' } }, [
      el('div', { class: 'field' }, [el('label', { for: 'q-type', text: 'પ્રશ્નનો પ્રકાર' }), type]),
      el('div', { class: 'field' }, [el('label', { for: 'q-cat', text: 'કેટેગરી' }), cat])]),
    scnField,
    el('div', { class: 'field' }, [el('label', { for: 'q-text', text: 'પ્રશ્ન (ગુજરાતી)' }), text]),
    el('div', { class: 'field' }, [el('label', { for: 'q-help', text: 'મદદરૂપ સૂચના (વૈકલ્પિક)' }), help]),
    el('div', { class: 'field', style: { maxWidth: '10rem' } }, [el('label', { for: 'q-w', text: 'વજન' }), weight]),
    ratingSection, optSection, err,
    el('div', { class: 'dialog-actions' }, [
      el('button', { class: 'btn btn-quiet', type: 'button', text: 'રદ કરો', onclick: () => dlg.close() }),
      el('button', { class: 'btn btn-primary', type: 'button', text: 'સાચવો', onclick: save })])
  ]);
  function save() {
    err.textContent = '';
    const opts = type.value === 'rating' ? [] : optRows.filter(r => !r.removed && r.label.value.trim())
      .map((r, i) => ({ id: (existing && existing.opts[i] && existing.opts[i].id) || (900000 + Math.floor(Math.random() * 99999)),
        l: r.label.value.trim(), s: Number(r.score.value) }));
    if (!text.value.trim()) { err.textContent = 'પ્રશ્નનું લખાણ ભરવું જરૂરી છે.'; return; }
    if (type.value !== 'rating' && opts.length < 2) { err.textContent = 'ઓછામાં ઓછા બે વિકલ્પ ઉમેરો.'; return; }
    const rec = {
      id: existing ? existing.id : Math.max(0, ...questions.map(q => q.id)) + 1,
      type: type.value, text: text.value.trim(), help: help.value.trim(),
      scenario: type.value === 'scenario' ? scenario.value.trim() : '',
      cat: Number(cat.value), sec: existing ? existing.sec : Number(cat.value),
      w: Number(weight.value) || 1, req: existing ? existing.req : true,
      rmin: Number(rmin.value) || 1, rmax: Number(rmax.value) || 5, opts
    };
    if (existing) questions[questions.indexOf(existing)] = rec;
    else questions.push(rec);
    saveQuestions(); dlg.close();
    toast(existing ? 'પ્રશ્ન સચવાયો.' : 'નવો પ્રશ્ન ઉમેરાયો.');
    AdminQuestions(view);
  }
  dlg.addEventListener('close', () => dlg.remove(), { once: true });
  document.body.append(dlg); dlg.showModal(); text.focus();
}

// ---- reports ----
function AdminReports(view) {
  clear(view).append(pageHead('રિપોર્ટ્સ', 'નિકાસ અને સારાંશ'), filterBar(() => AdminReports(view)));
  const rows = applyFilters(adminState.filters);
  setCount(rows.length);
  const body = el('div', { class: 'section-block' });
  view.append(body);

  body.append(el('h2', { text: 'ડેટા નિકાસ' }),
    el('p', { class: 'hint', text: 'નિકાસ હાલ લાગુ કરેલા ફિલ્ટર પ્રમાણે થાય છે. CSV ફાઇલ UTF-8 BOM સાથે બને છે, જેથી Excel માં ગુજરાતી બરાબર દેખાય.' }),
    el('div', { style: { display: 'flex', gap: '.75rem', flexWrap: 'wrap', marginTop: '1rem' } }, [
      el('button', { class: 'btn btn-primary', type: 'button', text: 'પ્રતિભાગી અને સ્કોર (CSV)',
        onclick: () => exportResponses(rows) }),
      el('button', { class: 'btn btn-quiet', type: 'button', text: 'પ્રશ્નવાર જવાબ (CSV)',
        onclick: () => exportAnswers(rows) }),
      el('button', { class: 'btn btn-quiet', type: 'button', text: 'કેટેગરી સારાંશ (CSV)',
        onclick: () => exportCategories(rows) }),
      el('button', { class: 'btn btn-quiet', type: 'button', text: 'આ પાનું પ્રિન્ટ / PDF', onclick: () => window.print() })
    ]));

  if (!rows.length) { body.append(el('div', { style: { marginTop: '2rem' } },
    [emptyState('આ ફિલ્ટર માટે ડેટા નથી', 'ફિલ્ટર બદલો.')])); return; }
  const k = kpis(rows), perf = categoryPerf(rows);
  body.append(el('h2', { class: 'section-block', text: 'સારાંશ રિપોર્ટ' }),
    el('div', { class: 'panel' }, [
      el('div', { class: 'assess-meta', style: { marginBottom: '1rem' } }, [
        el('span', { text: 'મૂલ્યાંકન: ' + BRAND.titleGu }),
        el('span', { text: `તારીખ: ${adminState.filters.date_from || 'શરૂઆતથી'} – ${adminState.filters.date_to || 'આજ સુધી'}` }),
        el('span', { text: 'તૈયાર: ' + fmtDateTime(new Date().toISOString()) })]),
      el('ul', { class: 'ledger' }, [
        ledgerRow('કુલ પ્રતિસાદ', intFmt(k.n), null),
        ledgerRow('સરેરાશ સ્કોર', k.avg + '%', k.avg),
        ledgerRow('સૌથી ઓછો સ્કોર', k.min + '%', k.min),
        ledgerRow('સૌથી વધુ સ્કોર', k.max + '%', k.max)
      ].concat(perf.map(c => ledgerRow('— ' + c.label, c.avg + '%', c.avg, c.color))))
    ]));
}

// ---- data & settings ----
function AdminData(view) {
  clear(view).append(pageHead('ડેટા અને સેટિંગ્સ', 'આ બ્રાઉઝરમાં સંગ્રહાયેલો ડેટા'));
  const demoN = responses.filter(r => r.is_demo).length;
  const realN = responses.length - demoN;
  const count = el('input', { type: 'number', value: 160, min: 1, max: 2000, style: { maxWidth: '8rem' } });

  view.append(el('section', { class: 'section-block' }, [
    el('h2', { text: 'ડેમો ડેટા' }),
    el('div', { class: 'panel' }, [
      el('div', { class: 'notice notice-demo' }, [
        el('strong', { text: 'ડેમો ડેટા અલગ રખાય છે. ' }),
        'ડેમો પ્રતિભાગીઓ ફિલ્ટરમાં "ડેમો ડેટા સામેલ કરો" ચાલુ હોય ત્યારે જ ગણાય છે. તેને કાઢવાથી સાચા પ્રતિભાગીઓને અસર થતી નથી.']),
      el('ul', { class: 'ledger', style: { marginBottom: '1rem' } }, [
        ledgerRow('ડેમો પ્રતિસાદ', intFmt(demoN), null),
        ledgerRow('સાચા પ્રતિસાદ', intFmt(realN), null),
        ledgerRow('કુલ', intFmt(responses.length), null)]),
      el('div', { style: { display: 'flex', gap: '.75rem', alignItems: 'flex-end', flexWrap: 'wrap' } }, [
        el('div', { class: 'field', style: { margin: 0 } },
          [el('span', { class: 'label', text: 'કેટલા બનાવવા?' }), count]),
        el('button', { class: 'btn btn-quiet', type: 'button', text: 'ડેમો ડેટા બનાવો', onclick: () => {
          const n = generateDemo(Math.max(1, Math.min(2000, Number(count.value) || 160)), Date.now() & 0xffff);
          toast(`${intFmt(n)} ડેમો પ્રતિસાદ બન્યા.`); AdminData(view);
        } }),
        el('button', { class: 'btn btn-danger', type: 'button', text: 'બધો ડેમો ડેટા કાઢો', onclick: async () => {
          const ok = await confirmDialog({ title: 'બધો ડેમો ડેટા કાઢવો છે?',
            message: 'ડેમો તરીકે નિશાન કરેલા બધા પ્રતિસાદ દૂર થશે. સાચા પ્રતિભાગીઓ યથાવત્ રહેશે.',
            confirmLabel: 'હા, કાઢી નાખો', danger: true });
          if (!ok) return;
          const before = responses.length;
          responses = responses.filter(r => !r.is_demo); saveResponses();
          toast(`${intFmt(before - responses.length)} ડેમો પ્રતિસાદ કાઢી નાખ્યા.`); AdminData(view);
        } })])
    ])
  ]));

  view.append(el('section', { class: 'section-block' }, [
    el('h2', { text: 'બેકઅપ' }),
    el('div', { class: 'panel' }, [
      el('p', { class: 'hint', text: 'બ્રાઉઝરનો સંગ્રહ કાયમી નથી — બ્રાઉઝિંગ ડેટા સાફ કરવાથી બધું ભૂંસાઈ જાય છે. મહત્ત્વનો ડેટા JSON તરીકે ઉતારી લો.' }),
      el('div', { style: { display: 'flex', gap: '.75rem', flexWrap: 'wrap', marginTop: '1rem' } }, [
        el('button', { class: 'btn btn-quiet', type: 'button', text: 'JSON બેકઅપ ડાઉનલોડ', onclick: () => {
          const blob = new Blob([JSON.stringify({ responses, questions }, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = el('a', { href: url, download: 'udyog-backup.json' });
          document.body.append(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } }),
        el('button', { class: 'btn btn-quiet', type: 'button', text: 'પ્રશ્નો મૂળ સ્થિતિમાં લાવો', onclick: async () => {
          const ok = await confirmDialog({ title: 'પ્રશ્નો રીસેટ કરવા છે?',
            message: 'તમે કરેલા બધા પ્રશ્ન-ફેરફાર દૂર થશે અને મૂળ 30 પ્રશ્નો પાછા આવશે.', danger: true });
          if (!ok) return;
          questions = SEED.questions.map(q => JSON.parse(JSON.stringify(q)));
          Store.del(KEY.Q); toast('પ્રશ્નો રીસેટ થયા.'); AdminData(view);
        } }),
        el('button', { class: 'btn btn-danger', type: 'button', text: 'બધો ડેટા ભૂંસો', onclick: async () => {
          const ok = await confirmDialog({ title: 'બધો ડેટા ભૂંસવો છે?',
            message: 'આ બ્રાઉઝરમાં સંગ્રહાયેલા બધા પ્રતિસાદ, પ્રશ્ન-ફેરફાર અને અધૂરાં મૂલ્યાંકન કાયમ માટે દૂર થશે.',
            confirmLabel: 'હા, બધું ભૂંસો', danger: true });
          if (!ok) return;
          [KEY.RESP, KEY.Q, KEY.DRAFT].forEach(Store.del);
          responses = []; questions = SEED.questions.map(q => JSON.parse(JSON.stringify(q)));
          toast('બધો ડેટા ભૂંસાયો.'); AdminData(view);
        } })])
    ])
  ]));

  view.append(el('section', { class: 'section-block' }, [
    el('h2', { text: 'આ સંસ્કરણ વિશે' }),
    el('div', { class: 'panel' }, [
      el('p', { style: { fontWeight: '500' }, text: BRAND.code + ' — ' + BRAND.sub }),
      el('p', { text: 'આ GitHub Pages માટેનું સ્થિર (static) સંસ્કરણ છે. તેમાં કોઈ સર્વર કે ડેટાબેઝ નથી — બધું તમારા બ્રાઉઝરમાં ચાલે છે.' }),
      el('ul', { class: 'ledger' }, [
        ledgerRow('સ્કોરિંગ', 'બ્રાઉઝરમાં', null),
        ledgerRow('સંગ્રહ', Store.persistent ? 'localStorage' : 'ફક્ત મેમરી', null),
        ledgerRow('એડમિન ઓળખ-ચકાસણી', 'માત્ર દેખાવ પૂરતી', null),
        ledgerRow('પ્રશ્નો', guNum(questions.length), null),
        ledgerRow('કેટેગરી', guNum(SEED.categories.length), null),
        ledgerRow('પરિણામ સ્તર', guNum(SEED.bands.length), null)
      ]),
      el('p', { class: 'hint', style: { marginTop: '1rem' },
        text: 'સાચી બહુ-વપરાશકર્તા જમાવટ માટે Node + SQLite સંસ્કરણ વાપરો, જેમાં સર્વર-સાઇડ સ્કોરિંગ, bcrypt લોગિન, ભૂમિકા-આધારિત પ્રવેશ, CSRF રક્ષણ અને ઓડિટ લોગ છે.' })
    ])
  ]));
}

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------
initTheme();
// Only pre-hide reveal targets once we know scripts are running.
document.documentElement.classList.add('js');
attachRipples(document);
window.addEventListener('hashchange', route);
window.addEventListener('error', (e) => console.error('app error:', e.error || e.message));
// First visit with an empty store gets demo data so the dashboard is not blank.
if (!responses.length && !Store.get('udyog.seeded', false)) {
  generateDemo(160, 20260820);
  Store.set('udyog.seeded', true);
}
route();
})();
</script>
